version: '3'

tasks:
  serve:
    desc: Run streaming dashboard server on http://localhost:8000
    cmds:
      - uv run python -m acoustix.server.app {{.CLI_ARGS}}

  ruff:
    desc: Run ruff linter and format check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Format and auto-fix code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run test suite with pytest
    cmds:
      - uv run pytest

  pre-commit:
    desc: Run all pre-commit checks (ruff + tests)
    cmds:
      - task: ruff
      - task: test
