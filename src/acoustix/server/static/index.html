<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACOUSTIX</title>
  <link rel="stylesheet" href="/static/palette.css?v=20261013">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-primary);
    }

    .source-control {
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      padding: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .source-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.12s ease;
    }

    .source-btn:hover {
      color: var(--text-secondary);
      background: var(--bg-panel-hover);
    }

    .source-btn.active {
      color: var(--text-primary);
      background: var(--bg-elevated);
      border-color: var(--border-strong);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 4px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-disconnected);
      transition: background 0.2s;
    }

    .status-dot.connected {
      background: var(--status-connected);
    }

    main {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* HUD Metrics Grid */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .hud-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 94px;
      min-height: 94px;
      max-height: 94px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .hud-card-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-card-value {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 4px;
      line-height: 28px;
      height: 28px;
      white-space: nowrap;
      overflow: hidden;
    }

    .confidence-meter {
      height: 3px;
      background: var(--border-subtle);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: var(--text-secondary);
      transition: width 0.1s linear;
    }

    .harmonics-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 6px;
      height: 24px;
      align-items: center;
    }

    .harmonic-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 2px;
      border-radius: 3px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .harmonic-tag.active {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    /* Waterfall Spectrogram Container */
    .spectrogram-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 560px;
      min-height: 560px;
      max-height: 560px;
      box-sizing: border-box;
    }

    .spectrogram-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .colormap-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
    }

    .colormap-gradient {
      width: 100px;
      height: 8px;
      border-radius: 2px;
      background: var(--colormap-gradient);
      border: 1px solid var(--border-subtle);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 520px;
      background: var(--bg-canvas);
    }

    canvas#waterfallCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 24px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-title">ACOUSTIX</div>
    </div>
    <div class="source-control">
      <button id="btnSynth" class="source-btn active" type="button">SYNTHETIC</button>
      <button id="btnMic" class="source-btn" type="button">MICROPHONE</button>
    </div>
    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">DISCONNECTED</span>
    </div>
  </header>

  <main>
    <section class="hud-grid">
      <!-- RPM Readout -->
      <div class="hud-card">
        <div class="hud-card-label">ROTATIONAL SPEED</div>
        <div class="hud-card-value" id="rpmValue">--- RPM</div>
      </div>

      <!-- BPF Readout -->
      <div class="hud-card">
        <div class="hud-card-label">BLADE PASSING FREQUENCY</div>
        <div class="hud-card-value" id="bpfValue">--- HZ</div>
      </div>

      <!-- Tracking Confidence -->
      <div class="hud-card">
        <div class="hud-card-label">CONFIDENCE</div>
        <div class="hud-card-value" id="confidenceValue">0.0%</div>
        <div class="confidence-meter">
          <div class="confidence-fill" id="confidenceFill"></div>
        </div>
      </div>

      <!-- Harmonics -->
      <div class="hud-card">
        <div class="hud-card-label">HARMONICS</div>
        <div class="harmonics-list" id="harmonicsList">
          <span class="harmonic-tag" id="hTag0">1&times; ---</span>
          <span class="harmonic-tag" id="hTag1">2&times; ---</span>
          <span class="harmonic-tag" id="hTag2">3&times; ---</span>
          <span class="harmonic-tag" id="hTag3">4&times; ---</span>
        </div>
      </div>
    </section>

    <!-- Waterfall Spectrogram -->
    <section class="spectrogram-container">
      <div class="spectrogram-header">
        <div>SPECTROGRAM // 0 &ndash; 6,000 HZ</div>
        <div class="colormap-bar">
          <span>-90 DB</span>
          <div class="colormap-gradient"></div>
          <span>0 DB</span>
        </div>
      </div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="waterfallCanvas"></canvas>
      </div>
    </section>
  </main>

  <footer>
    <div id="fpsInfo">STREAM: -- FPS</div>
  </footer>

  <script src="/static/app.js?v=20261013-7"></script>
</body>
</html>
